name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test StreamDeckPluginSharp.sln -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack NuGet and sample plugin
        run: |
          chmod +x pack.sh samples/CounterSample/publish.sh
          ./pack.sh Release
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*
      - name: Upload Stream Deck plugin
        uses: actions/upload-artifact@v4
        with:
          name: countersample-plugin
          path: artifacts/plugin/*.streamDeckPlugin
